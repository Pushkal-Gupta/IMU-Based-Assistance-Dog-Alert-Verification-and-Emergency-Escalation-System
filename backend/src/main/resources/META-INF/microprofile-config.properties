# Escalation watchdog tolerances.
#
# relay.timeout must exceed (relay heartbeat interval x tolerated misses) or
# ordinary network jitter will trigger spurious takeovers. The relay defaults to
# a 15 s heartbeat and 3 misses, so 60 s leaves margin.
escalation.watchdog.relay.timeout.seconds=60

# Absolute ceiling on how long any alert may remain open, whatever the reason.
escalation.watchdog.alert.max.open.seconds=600

escalation.emergency.contact.id=emerg-1
escalation.owner.name=the owner
